---
name: GitHub backup

on: # yamllint disable-line rule:truthy
  schedule:
    - cron: "37 3 * * 0"
  workflow_dispatch:

concurrency:
  group: github-gcs-backup
  cancel-in-progress: false

permissions:
  contents: read
  issues: read
  pull-requests: read
  id-token: write

env:
  GCP_PROJECT_ID: gen-lang-client-0123391680
  GCS_BUCKET: zasobnik-tr-github
  WIF_PROVIDER: projects/833314992090/locations/global/workloadIdentityPools/github-actions/providers/twojstar-backup
  MAX_BACKUP_BYTES: "2147483648"
  MAX_BILLABLE_BYTES: "4294967296"

jobs:
  backup:
    name: Back up GitHub repositories
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout control repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Check GPTomek authentication
        id: auth
        shell: bash
        env:
          GPTOMEK_APP_CLIENT_ID: ${{ vars.GPTOMEK_APP_CLIENT_ID }}
          GPTOMEK_APP_PRIVATE_KEY: ${{ secrets.GPTOMEK_APP_PRIVATE_KEY }}
        run: |
          if [[ -n "$GPTOMEK_APP_CLIENT_ID" && -n "$GPTOMEK_APP_PRIVATE_KEY" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GPTomek private key is unavailable; backing up public repositories only."
          fi

      - name: Create trvny read token
        if: steps.auth.outputs.configured == 'true'
        id: trvny-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GPTOMEK_APP_CLIENT_ID }}
          private-key: ${{ secrets.GPTOMEK_APP_PRIVATE_KEY }}
          owner: trvny
          permission-contents: read
          permission-issues: read
          permission-pull-requests: read

      - name: Create twojstar read token
        if: steps.auth.outputs.configured == 'true'
        id: twojstar-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GPTOMEK_APP_CLIENT_ID }}
          private-key: ${{ secrets.GPTOMEK_APP_PRIVATE_KEY }}
          owner: twojstar
          permission-contents: read
          permission-issues: read
          permission-pull-requests: read

      - name: Ensure Git LFS is available
        shell: bash
        run: |
          if ! git lfs version; then
            sudo apt-get update
            sudo apt-get install -y git-lfs
          fi

      - name: Build repository archives
        shell: bash
        env:
          TRVNY_TOKEN: ${{ steps.trvny-token.outputs.token }}
          TWOJSTAR_TOKEN: ${{ steps.twojstar-token.outputs.token }}
          PUBLIC_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          mkdir -p backup/github work
          repos_file="$(mktemp)"

          if [[ -n "$TRVNY_TOKEN" && -n "$TWOJSTAR_TOKEN" ]]; then
            auth_mode="gptomek-app"
            GH_TOKEN="$TRVNY_TOKEN" gh api --paginate installation/repositories \
              --jq '.repositories[].full_name' >> "$repos_file"
            GH_TOKEN="$TWOJSTAR_TOKEN" gh api --paginate installation/repositories \
              --jq '.repositories[].full_name' >> "$repos_file"
          else
            auth_mode="public-fallback"
            GH_TOKEN="$PUBLIC_TOKEN" gh api --paginate \
              'users/trvny/repos?type=owner&per_page=100' \
              --jq '.[] | select(.visibility == "public") | .full_name' >> "$repos_file"
            GH_TOKEN="$PUBLIC_TOKEN" gh api --paginate \
              'orgs/twojstar/repos?type=public&per_page=100' \
              --jq '.[].full_name' >> "$repos_file"
          fi
          sort -u -o "$repos_file" "$repos_file"
          if [[ ! -s "$repos_file" ]]; then
            echo "::error::Repository discovery returned no repositories."
            exit 1
          fi

          while IFS= read -r repo; do
            [[ -n "$repo" ]] || continue
            owner="${repo%%/*}"
            name="${repo#*/}"

            case "$owner" in
              trvny) token="$TRVNY_TOKEN" ;;
              twojstar) token="$TWOJSTAR_TOKEN" ;;
              *) continue ;;
            esac

            mirror="work/$owner/$name.git"
            archive="backup/github/$owner/$name.git.tar.gz"
            metadata_dir="work/github-metadata/$owner/$name"
            metadata_archive="backup/github/metadata/$owner/$name.github-metadata.tar.gz"
            mkdir -p \
              "work/$owner" \
              "backup/github/$owner" \
              "work/github-metadata/$owner" \
              "backup/github/metadata/$owner"

            if [[ -n "$token" ]]; then
              auth="$(printf 'x-access-token:%s' "$token" | base64 -w0)"
              git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
                clone --mirror "https://github.com/$repo.git" "$mirror"
              git -C "$mirror" \
                -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
                lfs fetch --all
            else
              git clone --mirror "https://github.com/$repo.git" "$mirror"
              git -C "$mirror" lfs fetch --all
            fi

            git -C "$mirror" fsck --full
            tar -C "work/$owner" -czf "$archive" "$name.git"

            api_token="$token"
            if [[ -z "$api_token" ]]; then
              api_token="$PUBLIC_TOKEN"
            fi
            GH_TOKEN="$api_token" node \
              "$GITHUB_WORKSPACE/.github/scripts/github-backup-metadata.cjs" \
              "$repo" "$mirror" "$metadata_dir"
            tar -C "work/github-metadata/$owner" \
              -czf "$metadata_archive" "$name"
          done < "$repos_file"

          (
            cd backup/github
            find . -type f -name '*.tar.gz' -print0 \
              | sort -z \
              | xargs -0 sha256sum
          ) > backup/github/SHA256SUMS

          archives_file="$(mktemp)"
          find backup/github -type f -name '*.tar.gz' -printf '%P\n' \
            | sort -u > "$archives_file"

          {
            printf 'generated_at=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            printf 'repository_count=%s\n' "$(wc -l < "$repos_file" | tr -d ' ')"
            printf 'archive_count=%s\n' "$(wc -l < "$archives_file" | tr -d ' ')"
            printf 'auth_mode=%s\n' "$auth_mode"
            printf 'metadata_schema_version=1\n'
            printf 'repositories:\n'
            sed 's/^/  - /' "$repos_file"
            printf 'archives:\n'
            sed 's/^/  - /' "$archives_file"
          } > backup/github/MANIFEST.txt

      - name: Guard single backup size
        shell: bash
        run: |
          bytes="$(du -sb backup/github | cut -f1)"
          if (( bytes > MAX_BACKUP_BYTES )); then
            echo "::error::Backup is ${bytes} bytes; refusing to exceed the 2 GiB safety cap."
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Verify backup bucket policy
        shell: bash
        run: |
          bucket_json="$RUNNER_TEMP/github-backup-bucket.json"
          gcloud storage buckets describe "gs://${GCS_BUCKET}" --format=json > "$bucket_json"
          python - "$bucket_json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              bucket = json.load(handle)

          expected = {
              "location": "US-CENTRAL1",
              "default_storage_class": "STANDARD",
              "public_access_prevention": "enforced",
              "requester_pays": False,
              "uniform_bucket_level_access": True,
          }
          failures = [
              f"{key}={bucket.get(key)!r}, expected {value!r}"
              for key, value in expected.items()
              if bucket.get(key) != value
          ]
          soft_delete = bucket.get("soft_delete_policy", {})
          retention = soft_delete.get("retentionDurationSeconds")
          if retention is None:
              duration = str(soft_delete.get("retentionDuration", ""))
              retention = duration.removesuffix("s") if duration else None
          retention = str(retention)
          if retention != "604800":
              failures.append(f"soft-delete retention={retention!r}, expected '604800'")
          versioning_enabled = bucket.get("versioning_enabled")
          if versioning_enabled is None:
              versioning_enabled = bucket.get("versioning", {}).get("enabled", False)
          if versioning_enabled:
              failures.append("object versioning must be disabled")
          if failures:
              raise SystemExit("Bucket policy drift: " + "; ".join(failures))
          PY


      - name: Merge retained fallback metadata
        if: steps.auth.outputs.configured != 'true'
        shell: bash
        run: |
          set -euo pipefail

          scratch="$RUNNER_TEMP/github-backup-retained"
          mkdir -p "$scratch"
          current_archives="$scratch/current-archives.txt"
          remote_archives="$scratch/remote-archives.txt"
          retained_archives="$scratch/retained-archives.txt"
          previous_checksums="$scratch/previous-SHA256SUMS"
          retained_checksums="$scratch/retained-SHA256SUMS"

          find backup/github -type f -name '*.tar.gz' -printf '%P\n' \
            | sort -u > "$current_archives"

          set +e
          remote_output="$(gcloud storage ls "gs://${GCS_BUCKET}/github/**/*.tar.gz" 2>&1)"
          remote_status=$?
          set -e
          if (( remote_status == 0 )); then
            printf '%s\n' "$remote_output" \
              | sed "s#^gs://${GCS_BUCKET}/github/##" \
              | sed '/^$/d' \
              | sort -u > "$remote_archives"
          elif grep -q 'matched no objects' <<<"$remote_output"; then
            : > "$remote_archives"
          else
            printf '%s\n' "$remote_output" >&2
            exit "$remote_status"
          fi

          comm -23 "$remote_archives" "$current_archives" > "$retained_archives"
          : > "$retained_checksums"

          if [[ -s "$retained_archives" ]]; then
            if ! gcloud storage cp \
              "gs://${GCS_BUCKET}/github/SHA256SUMS" "$previous_checksums" >/dev/null 2>&1; then
              echo "::error::Retained archives exist but the previous SHA256SUMS is unavailable."
              exit 1
            fi

            while IFS= read -r archive; do
              checksum_line="$(awk -v target="$archive" '
                {
                  path = $2
                  sub(/\r$/, "", path)
                  sub(/^\.\//, "", path)
                  if (path == target) { sub(/\r$/, ""); print; exit }
                }
              ' "$previous_checksums")"
              if [[ -z "$checksum_line" ]]; then
                echo "::error::Missing retained checksum for $archive."
                exit 1
              fi
              printf '%s\n' "$checksum_line" >> "$retained_checksums"
            done < "$retained_archives"
          fi

          cat "$retained_checksums" backup/github/SHA256SUMS \
            | sort -k2,2 > "$scratch/SHA256SUMS"
          cp "$scratch/SHA256SUMS" backup/github/SHA256SUMS

          repos="$scratch/repositories.txt"
          awk '
            /^repositories:$/ { section=1; next }
            /^archives:$/ { section=0 }
            section && /^  - / { sub(/^  - /, ""); print }
          ' backup/github/MANIFEST.txt > "$repos"
          sed -n 's/\.git\.tar\.gz$//p' "$retained_archives" >> "$repos"
          sort -u -o "$repos" "$repos"

          archives="$scratch/archives.txt"
          cat "$current_archives" "$retained_archives" | sort -u > "$archives"
          generated_at="$(sed -n 's/^generated_at=//p' backup/github/MANIFEST.txt | head -n 1)"

          {
            printf 'generated_at=%s\n' "$generated_at"
            printf 'repository_count=%s\n' "$(wc -l < "$repos" | tr -d ' ')"
            printf 'archive_count=%s\n' "$(wc -l < "$archives" | tr -d ' ')"
            printf 'auth_mode=public-fallback\n'
            printf 'metadata_schema_version=1\n'
            printf 'metadata_scope=live-archive-union\n'
            printf 'repositories:\n'
            sed 's/^/  - /' "$repos"
            printf 'archives:\n'
            sed 's/^/  - /' "$archives"
          } > backup/github/MANIFEST.txt

      - name: Guard billed storage headroom
        shell: bash
        run: |
          set -euo pipefail

          sum_bucket_bytes() {
            local soft_deleted="${1:-false}"
            local args=(--exhaustive)
            local output status
            if [[ "$soft_deleted" == "true" ]]; then
              args+=(--soft-deleted)
            fi

            set +e
            output="$(gcloud storage ls -l "gs://${GCS_BUCKET}/**" "${args[@]}" 2>&1)"
            status=$?
            set -e

            if (( status != 0 )); then
              if grep -q 'matched no objects' <<<"$output"; then
                echo 0
                return 0
              fi
              printf '%s\n' "$output" >&2
              return "$status"
            fi

            awk '$1 ~ /^[0-9]+$/ { total += $1 } END { printf "%.0f\n", total + 0 }' <<<"$output"
          }

          new_bytes="$(du -sb backup/github | cut -f1)"
          live_bytes="$(sum_bucket_bytes false)"
          soft_deleted_bytes="$(sum_bucket_bytes true)"
          projected_bytes=$((new_bytes + live_bytes + soft_deleted_bytes))

          echo "Live bytes: $live_bytes"
          echo "Soft-deleted bytes: $soft_deleted_bytes"
          echo "New backup bytes: $new_bytes"
          echo "Worst-case projected billable bytes: $projected_bytes"

          if (( projected_bytes > MAX_BILLABLE_BYTES )); then
            echo "::error::Projected billable storage exceeds the 4 GiB safety cap."
            exit 1
          fi

      - name: Sync backup to Cloud Storage
        shell: bash
        env:
          FULL_BACKUP: ${{ steps.auth.outputs.configured }}
        run: |
          if [[ "$FULL_BACKUP" == "true" ]]; then
            gcloud storage rsync backup/github "gs://${GCS_BUCKET}/github" \
              --recursive \
              --delete-unmatched-destination-objects
          else
            echo "::notice::Public fallback is non-destructive; existing private archives are preserved."
            gcloud storage rsync backup/github "gs://${GCS_BUCKET}/github" --recursive
          fi


      - name: Verify live backup catalog
        shell: bash
        run: |
          set -euo pipefail

          scratch="$RUNNER_TEMP/github-backup-catalog"
          mkdir -p "$scratch"
          remote="$scratch/remote.txt"
          checksums="$scratch/checksums.txt"
          manifest="$scratch/manifest.txt"

          gcloud storage ls "gs://${GCS_BUCKET}/github/**/*.tar.gz" \
            | sed "s#^gs://${GCS_BUCKET}/github/##" \
            | sort -u > "$remote"
          awk '{ path = $2; sub(/\r$/, "", path); sub(/^\.\//, "", path); print path }' backup/github/SHA256SUMS \
            | sort -u > "$checksums"
          awk '
            /^archives:$/ { section=1; next }
            section && /^  - / { sub(/^  - /, ""); print; next }
            section { exit }
          ' backup/github/MANIFEST.txt | sort -u > "$manifest"

          if ! diff -u "$remote" "$checksums"; then
            echo "::error::SHA256SUMS does not match the live archive set."
            exit 1
          fi
          if ! diff -u "$remote" "$manifest"; then
            echo "::error::MANIFEST.txt does not match the live archive set."
            exit 1
          fi

      - name: Summarize backup
        shell: bash
        run: |
          files="$(find backup/github -type f | wc -l | tr -d ' ')"
          bytes="$(du -sb backup/github | cut -f1)"
          {
            echo '## GitHub backup'
            echo
            echo "Files: $files"
            echo
            echo "Bytes: $bytes"
            echo
            echo "Destination: gs://${GCS_BUCKET}/github/"
          } >> "$GITHUB_STEP_SUMMARY"
