---
name: organization profile

on: # yamllint disable-line rule:truthy
  schedule:
    - cron: "37 21 */2 * *"
  workflow_dispatch:

concurrency:
  group: organization-profile
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  profile:
    name: Refresh organization profile
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout profile upkeep script
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts/sync-profile.cjs
          sparse-checkout-cone-mode: false

      - name: Refresh PR and drawer sections
        uses: actions/github-script@v9
        with:
          script: |
            const sync = require('./.github/scripts/sync-profile.cjs');
            const result = await sync({ github, context, core });
            await core.summary
              .addRaw(
                `## Organization profile\n\n` +
                  `Updated: ${result.changed ? 'yes' : 'no'}\n\n` +
                  `Open PRs: ${result.openPullRequests}`,
              )
              .write();
